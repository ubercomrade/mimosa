[project]
name = "mimosa-tool"
version = "1.4.5"
description = "Model-independent motif similarity assessment tool"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Anton Tsukanov", email = "ubercomrade@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "joblib>=1.5.3",
    "numba>=0.66.0",
    "numpy>=2.4.6",
]

[project.urls]
Homepage = "https://github.com/ubercomrade/mimosa"
Repository = "https://github.com/ubercomrade/mimosa"
Issues = "https://github.com/ubercomrade/mimosa/issues"

[project.scripts]
mimosa = "mimosa.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mimosa"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]
