[project]
name = "mimosa-tool"
version = "2.0.4"
description = "Model-independent motif similarity assessment tool"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Anton Tsukanov", email = "ubercomrade@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "jax==0.10.0",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.10.0"]
cuda13 = ["jax[cuda13]==0.10.0"]
rocm = ["jax[rocm7-local]==0.10.0"]
rocm7 = [
    "rocm[libraries,device-all]==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax-rocm7-plugin==0.10.0+rocm7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax-rocm7-pjrt==0.10.0+rocm7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
rocm10 = [
    "rocm[libraries,device-all]==10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax-rocm10-plugin==0.10.0+rocm10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax-rocm10-pjrt==0.10.0+rocm10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
conflicts = [
    [
        { extra = "cuda12" },
        { extra = "cuda13" },
        { extra = "rocm" },
        { extra = "rocm7" },
        { extra = "rocm10" },
    ],
]
# AMD uses the same runtime package names across both versioned indexes.
index-strategy = "unsafe-first-match"

[[tool.uv.index]]
name = "amd-rocm7"
url = "https://repo.amd.com/rocm/whl-multi-arch/"

[[tool.uv.index]]
name = "amd-rocm10"
url = "https://stable.repo.amd.com/rocm/whl-next/"

[project.urls]
Homepage = "https://github.com/ubercomrade/mimosa"
Repository = "https://github.com/ubercomrade/mimosa"
Issues = "https://github.com/ubercomrade/mimosa/issues"

[project.scripts]
mimosa = "mimosa.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mimosa"
# Ship what the test suite needs so the sdist can be tested on its own.
source-include = ["tests/**", "examples/**", "benchmarks/**"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]
