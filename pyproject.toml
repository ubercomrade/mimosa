[project]
name = "mimosa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anton Tsukanov", email = "ubercomrade@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numba>=0.66.0",
    "numpy>=2.4.6",
    "tqdm>=4.70.0",
]

[project.scripts]
mimosa = "mimosa.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
