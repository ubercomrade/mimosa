name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Lint with ruff
        run: |
          uv sync --locked --group dev
          uv run ruff check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies and build
        run: uv sync --locked --group dev
      - name: Run pytest
        run: uv run pytest -q
      - name: Run examples
        run: uv run bash examples/run.sh

  windows-smoke:
    name: Windows PowerShell smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install dependencies and build
        run: uv sync --locked --group dev
      - name: Run PowerShell examples
        shell: pwsh
        run: ./examples/run.ps1
