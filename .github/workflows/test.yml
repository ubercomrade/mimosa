name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Lint with ruff
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies and build
        run: uv sync --group dev
      - name: Run pytest
        run: uv run pytest
      - name: Run examples
        working-directory: examples
        shell: bash
        run: |
          uv run bash ./run.sh
          uv run python ./benchmark_fast_profile_score.py \
            --threads 1 \
            --repeats 1 \
            --warmups 0 \
            --num-rows 10 \
            --row-length 20 \
            --modes pairwise \
            --metrics co \
            --min-logfpr 0
          uv run python ./benchmark_profile_one_to_many.py \
            --num-targets 3 \
            --num-sequences 10 \
            --seq-length 20 \
            --passes 1 \
            --metrics co \
            --min-logfpr 0 \
            --cache-modes off \
            --scenarios fresh
