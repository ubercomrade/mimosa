name: Build & Publish to PyPI

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests
    uses: ./.github/workflows/test.yml

  build_dist:
    name: Build distribution artifacts
    needs: [checks]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify release tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv version --short)"
          test "$tag_version" = "$project_version" || {
            echo "Tag version $tag_version does not match project version $project_version."
            exit 1
          }

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Test sdist installation, console entry point, and tests
        run: |
          mkdir sdist_src
          tar -xzf dist/*.tar.gz -C sdist_src --strip-components=1
          uv venv --python ${{ matrix.python-version }} test_env
          source test_env/bin/activate
          uv pip install dist/*.tar.gz pytest
          cd sdist_src
          mimosa --version
          pytest -q
          bash examples/run.sh

      - name: Test wheel console entry point
        run: |
          uv venv --python ${{ matrix.python-version }} wheel_env
          source wheel_env/bin/activate
          uv pip install dist/*.whl
          mimosa --version

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build_dist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mimosa-tool
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Publish to PyPI
        run: uv publish
