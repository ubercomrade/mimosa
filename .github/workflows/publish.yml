name: Build & Publish to PyPI

on:
  push:
    tags:
      - v*

jobs:
  build_dist:
    name: Build distribution artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify release tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv version --short)"
          test "$tag_version" = "$project_version" || {
            echo "Tag version $tag_version does not match project version $project_version."
            exit 1
          }

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Test sdist installation
        run: |
          uv venv test_env
          source test_env/bin/activate
          uv pip install dist/*.tar.gz
          uv pip install pytest
          python -c "import mimosa; print(mimosa.__all__)"
          pytest -q tests

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build_dist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mimosa-tool
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check artifacts
        run: uvx twine check dist/*

      - name: Publish to PyPI
        run: uv publish
